{{- if .Values.aaa.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nac-platform.fullname" . }}-aaa
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: aaa
spec:
  replicas: {{ .Values.aaa.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aaa
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aaa
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: aaa
          image: "{{ .Values.aaa.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.aaa.service.httpPort }}
              name: http
            - containerPort: {{ .Values.aaa.service.radiusAuthPort }}
              name: radius-auth
              protocol: UDP
            - containerPort: {{ .Values.aaa.service.radiusAcctPort }}
              name: radius-acct
              protocol: UDP
          env:
            {{- include "nac-platform.commonEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.aaa.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.aaa.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nac-platform.fullname" . }}-aaa
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aaa
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.aaa.service.httpPort }}
      targetPort: http
    - name: radius-auth
      port: {{ .Values.aaa.service.radiusAuthPort }}
      targetPort: radius-auth
      protocol: UDP
    - name: radius-acct
      port: {{ .Values.aaa.service.radiusAcctPort }}
      targetPort: radius-acct
      protocol: UDP
{{- end }}
