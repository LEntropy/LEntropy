{{- if .Values.adminConsole.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nac-platform.fullname" . }}-admin-console
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-console
spec:
  replicas: {{ .Values.adminConsole.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-console
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: admin-console
          image: "{{ .Values.adminConsole.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.adminConsole.service.port }}
              name: http
          resources:
            {{- toYaml .Values.adminConsole.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nac-platform.fullname" . }}-admin-console
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: admin-console
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.adminConsole.service.port }}
      targetPort: http
{{- if .Values.adminConsole.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nac-platform.fullname" . }}-admin-console
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.adminConsole.ingress.className }}
  rules:
    {{- range .Values.adminConsole.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "nac-platform.fullname" $ }}-admin-console
                port:
                  name: http
          {{- end }}
    {{- end }}
  {{- if .Values.adminConsole.ingress.tls }}
  tls:
    {{- toYaml .Values.adminConsole.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
