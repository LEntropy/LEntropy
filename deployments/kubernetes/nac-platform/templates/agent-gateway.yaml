{{- if .Values.agentGateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nac-platform.fullname" . }}-agent-gateway
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-gateway
spec:
  replicas: {{ .Values.agentGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agent-gateway
          image: "{{ .Values.agentGateway.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.agentGateway.service.port }}
              name: grpc
          env:
            {{- include "nac-platform.commonEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.agentGateway.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.agentGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nac-platform.fullname" . }}-agent-gateway
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: agent-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.agentGateway.service.port }}
      targetPort: grpc
{{- end }}
