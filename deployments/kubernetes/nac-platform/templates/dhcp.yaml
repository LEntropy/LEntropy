{{- if .Values.dhcp.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nac-platform.fullname" . }}-dhcp
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dhcp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dhcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dhcp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: {{ .Values.dhcp.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: dhcp
          image: "{{ .Values.dhcp.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "nac-platform.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dhcp.resources | nindent 12 }}
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
      tolerations:
        - operator: Exists
{{- end }}
