{{- if .Values.enforcement.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nac-platform.fullname" . }}-enforcement
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: enforcement
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: enforcement
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enforcement
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: {{ .Values.enforcement.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: enforcement
          image: "{{ .Values.enforcement.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "nac-platform.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.enforcement.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.enforcement.securityContext | nindent 12 }}
      tolerations:
        - operator: Exists
{{- end }}
