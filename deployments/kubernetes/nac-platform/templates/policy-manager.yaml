{{- if .Values.policyManager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nac-platform.fullname" . }}-policy-manager
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-manager
spec:
  replicas: {{ .Values.policyManager.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: policy-manager
          image: "{{ .Values.policyManager.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.policyManager.service.port }}
              name: http
          env:
            {{- include "nac-platform.commonEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.policyManager.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.policyManager.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.policyManager.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.policyManager.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nac-platform.fullname" . }}-policy-manager
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: policy-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.policyManager.service.port }}
      targetPort: http
{{- end }}
