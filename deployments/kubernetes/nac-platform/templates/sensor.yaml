{{- if .Values.sensor.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nac-platform.fullname" . }}-sensor
  labels:
    {{- include "nac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: {{ .Values.sensor.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: sensor
          image: "{{ .Values.sensor.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "nac-platform.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.sensor.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sensor.securityContext | nindent 12 }}
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
      tolerations:
        - operator: Exists
{{- end }}
